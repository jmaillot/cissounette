services:
  wordpress-db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  wordpress:
    image: wordpress:6.7-php8.3-apache
    restart: unless-stopped
    depends_on:
      wordpress-db:
        condition: service_healthy
    # pas de port publié : le trafic arrive via le réseau Docker du Traefik existant
    environment:
      WORDPRESS_DB_HOST: wordpress-db
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      # derrière Traefik : WordPress doit générer des URLs https
      WORDPRESS_CONFIG_EXTRA: |
        if (isset($$_SERVER['HTTP_X_FORWARDED_PROTO']) && $$_SERVER['HTTP_X_FORWARDED_PROTO'] === 'https') {
          $$_SERVER['HTTPS'] = 'on';
        }
    labels:
      # === À ADAPTER : domaine, réseau et resolver de votre Traefik ===
      - traefik.enable=true
      - traefik.http.routers.cissounette.rule=Host(`domain.tld`)
      - traefik.http.routers.cissounette.entrypoints=websecure
      - traefik.http.routers.cissounette.tls.certresolver=le
      - traefik.http.services.cissounette.loadbalancer.server.port=80
    volumes:
      - wp_data:/var/www/html
      # thème enfant versionné dans Git, monté dans le conteneur
      - ./wp-content/themes/cissounette:/var/www/html/wp-content/themes/cissounette:ro
    networks:
      - default
      # nom du réseau externe partagé avec votre Traefik
      - proxy

networks:
  proxy:
    external: true

volumes:
  db_data:
  wp_data:
