# Déploiement automatique : à chaque push sur main, le VPS fait git pull + restart.
# Prérequis : déposer la clé privée SSH dans les secrets GitHub du dépôt
# (Settings > Secrets and variables > Actions > VPS_SSH_KEY),
# plus VPS_HOST et VPS_USER.
name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Déployer sur le VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/boutique
            git pull origin main
            docker compose pull
            docker compose up -d --build
            docker image prune -f
